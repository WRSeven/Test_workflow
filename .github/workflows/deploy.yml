name: Deploy to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-to-main
  cancel-in-progress: true

jobs:
  test:
    name: Test Deployment Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure git line endings
        run: git config --global core.safecrlf false; git config --global core.autocrlf input
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'
          cache: 'npm'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm config set engine-strict false
          npm install --legacy-peer-deps || npm install --ignore-scripts

      - name: Run Linting
        shell: pwsh
        run: |
          npm run lint:all -or $true
          Write-Output "Linting completed. Check logs for details."

      - name: URL Checker with timeout
        run: node script/url-checker.js ${{ vars.URL_CHECKER_TIMEOUT }}

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      #- name: Install dependencies
       # run: npm install

      - name: Build site
        run: npm run prod

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy Application
        run: |
          echo "Starting deployment..."
          scp -r ./build user@server:/var/www/html
          echo "Application deployed successfully."
