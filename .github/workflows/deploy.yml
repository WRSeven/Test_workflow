name: Deploy to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: deploy-to-main
  cancel-in-progress: true

jobs:
  test:
    name: Test Deployment Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Run linting
        run: npm run lint:all

      - name: Run all scripts in script/
        run: |
          for script in script/*.js; do
            if [ -f "$script" ]; then
              echo "Running $script"
              node "$script"
            fi
          done
          node script/url-checker.js -t ${{ vars.URL_CHECKER_TIMEOUT }}

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Debug PATH_PREFIX
        run: echo "PATH_PREFIX is $PATH_PREFIX"

      - name: Build site
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
        run: npm run prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: _site/
          retention-days: 30

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: _site

      - name: Deploy to GitHub Pages (gh-pages branch)
        id: deploy_pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Create deployment issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_STATUS: ${{ steps.deploy_pages.outcome }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          COMMIT_SHA="${GITHUB_SHA}"
          COMMIT_SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          ACTIONS_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          PAGES_URL="https://$(echo ${GITHUB_REPOSITORY} | cut -d'/' -f1).github.io/$(echo ${GITHUB_REPOSITORY} | cut -d'/' -f2)/
          
          # Determine deployment status
          if [ "${DEPLOY_STATUS}" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi
          
          TITLE="${DATE} - Deployment: ${STATUS}"
          
          cat > /tmp/issue_body.txt << 'EOF'
          **Repository:** REPO_URL
          **Commit:** [COMMIT_SHORT](REPO_URL/commit/GITHUB_SHA)
          **Actions Run:** [View Log](ACTIONS_URL)
          **Status:** DEPLOYMENT_STATUS
          **Pages URL:** PAGES_URL
          EOF
          
          sed -i "s|REPO_URL|${REPO_URL}|g" /tmp/issue_body.txt
          sed -i "s|COMMIT_SHORT|${COMMIT_SHORT}|g" /tmp/issue_body.txt
          sed -i "s|GITHUB_SHA|${COMMIT_SHA}|g" /tmp/issue_body.txt
          sed -i "s|ACTIONS_URL|${ACTIONS_URL}|g" /tmp/issue_body.txt
          sed -i "s|DEPLOYMENT_STATUS|Site deployed to \`gh-pages\` branch|g" /tmp/issue_body.txt
          sed -i "s|PAGES_URL|${PAGES_URL}|g" /tmp/issue_body.txt
          
          BODY=$(cat /tmp/issue_body.txt)
          gh issue create --title "${TITLE}" --body "${BODY}"
