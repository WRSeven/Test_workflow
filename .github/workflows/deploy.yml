name: Deploy to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: deploy-to-main
  cancel-in-progress: true

jobs:
  test:
    name: Test Deployment Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'
          cache: 'npm'

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Run linting
        run: npm run lint:all

      - name: Run all scripts in script/
        run: |
          for script in script/*.js; do
            if [ -f "$script" ]; then
              echo "Running $script"
              node "$script"
            fi
          done
      
      - name: URL Check with timeout
        run: node script/url-checker.js -t ${{ vars.URL_CHECKER_TIMEOUT }}

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'
          cache: 'npm'

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Build site
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
        run: npm run prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: _site/
          retention-days: 30

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: _site

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI with token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | gh auth login --with-token

      - name: Check GH auth
        run: gh auth status

      - name: Get Pages URL
        id: get_pages_url
        run: |
          PAGES_URL=$(gh api repos/${{ github.repository }}/pages --jq .html_url 2>/dev/null || echo "")
          echo "url=$PAGES_URL" >> $GITHUB_OUTPUT

      - name: Create deployment issue
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M:%SZ")
          STATUS="Success"
          if [ -z "${{ steps.get_pages_url.outputs.url }}" ]; then STATUS="Failed"; fi
          TITLE="$DATE - Deployment: $STATUS"
          BODY="URL: ${{ steps.get_pages_url.outputs.url }}"
          gh issue create --title "$TITLE" --body "$BODY"
