name: Deploy to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-to-main
  cancel-in-progress: true

jobs:
  test:
    name: Test Deployment Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'
          cache: 'npm'

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Run linting
        run: npm run lint:all

      - name: Run all scripts in script/
        run: |
          for script in script/*.js; do
            if [ -f "$script" ]; then
              echo "Running $script"
              node "$script"
            fi
          done
      
      - name: URL Check with timeout
        run: node script/url-checker.js -t ${{ vars.URL_CHECKER_TIMEOUT }}

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.12'
          cache: 'npm'

      - name: Update npm to 9.x
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules (sharp)
        run: npm rebuild sharp
        continue-on-error: true

      - name: Build site
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
        run: npm run prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: _site/
          retention-days: 30

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

